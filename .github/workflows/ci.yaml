name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.11"  # or whichever version you prefer

      - name: Install dependencies
        run: |
          # If you have a requirements.txt, do:
          # pip install -r requirements.txt
          # Otherwise, just install pytest directly:
          pip install pytest

      - name: Run tests
        run: |
          # Make sure you're in the project root (the default from checkout action).
          # Then run the tests:
          python -m pytest --maxfail=1 --disable-warnings -v
